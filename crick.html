<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#22262e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CricketScorer">
    <meta name="description" content="Comprehensive ball-by-ball cricket scoring system with detailed analytics. Created by Aakash Thakur.">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" sizes="152x152" href="./icons/icon-152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png">
    <link rel="icon" type="image/png" sizes="96x96" href="./icons/icon-96.png">
    <title>Cricket Scoring System</title>
    <style>
        /* ===== CSS RESET & BASE ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #1a1d23;
            --bg-secondary: #22262e;
            --bg-card: #282c34;
            --bg-input: #2c313a;
            --bg-hover: #333842;
            --border-color: #3a3f4a;
            --border-light: #454b57;
            --text-primary: #c8ccd4;
            --text-secondary: #8b919d;
            --text-muted: #636979;
            --accent: #6b8aad;
            --accent-hover: #7d9bbd;
            --accent-dim: rgba(107,138,173,0.15);
            --success: #6d9a6d;
            --success-dim: rgba(109,154,109,0.15);
            --warning: #b5995c;
            --warning-dim: rgba(181,153,92,0.15);
            --danger: #a86b6b;
            --danger-dim: rgba(168,107,107,0.15);
            --info: #7a9aaa;
            --info-dim: rgba(122,154,170,0.15);
            --four-color: #7a9a7a;
            --six-color: #9a8a6a;
            --wicket-color: #a07070;
            --radius: 8px;
            --radius-lg: 12px;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.4);
            --transition: all 0.2s ease;
        }

        html { font-size: 15px; scroll-behavior: smooth; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

        /* ===== HEADER ===== */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }
        .logo svg { width: 28px; height: 28px; fill: var(--accent); }
        .header-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

        /* ===== NAVIGATION TABS ===== */
        .nav-tabs {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .nav-tabs-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 0;
            min-width: max-content;
        }
        .nav-tab {
            padding: 0.65rem 1.1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: var(--transition);
            white-space: nowrap;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            font-family: inherit;
        }
        .nav-tab:hover { color: var(--text-primary); background: var(--bg-hover); }
        .nav-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
        }

        .page { display: none; }
        .page.active { display: block; }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            font-family: inherit;
            font-weight: 500;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-card);
            color: var(--text-primary);
            white-space: nowrap;
        }
        .btn:hover { background: var(--bg-hover); border-color: var(--border-light); }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
        .btn-primary:hover { background: rgba(107,138,173,0.25); }
        .btn-success { background: var(--success-dim); border-color: var(--success); color: var(--success); }
        .btn-success:hover { background: rgba(109,154,109,0.25); }
        .btn-danger { background: var(--danger-dim); border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: rgba(168,107,107,0.25); }
        .btn-warning { background: var(--warning-dim); border-color: var(--warning); color: var(--warning); }
        .btn-warning:hover { background: rgba(181,153,92,0.25); }
        .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.78rem; }
        .btn-lg { padding: 0.65rem 1.5rem; font-size: 0.95rem; }
        .btn-block { width: 100%; }
        .btn-icon { padding: 0.45rem; min-width: 36px; }

        /* ===== CARDS ===== */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow);
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .card-title .badge {
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-weight: 500;
        }

        /* ===== FORM ELEMENTS ===== */
        .form-group { margin-bottom: 1rem; }
        .form-label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.35rem;
            font-weight: 500;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 0.55rem 0.75rem;
            font-size: 0.88rem;
            font-family: inherit;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            transition: var(--transition);
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-dim);
        }
        .form-input::placeholder { color: var(--text-muted); }
        .form-select { cursor: pointer; }
        .form-select option { background: var(--bg-card); color: var(--text-primary); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        /* ===== TABLES ===== */
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            padding: 0.6rem 0.5rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }
        td {
            padding: 0.55rem 0.5rem;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }
        tr:hover td { background: var(--bg-hover); }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-secondary); }

        /* ===== BADGES ===== */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.55rem;
            font-size: 0.72rem;
            border-radius: var(--radius);
            font-weight: 500;
        }
        .badge-accent { background: var(--accent-dim); color: var(--accent); }
        .badge-success { background: var(--success-dim); color: var(--success); }
        .badge-warning { background: var(--warning-dim); color: var(--warning); }
        .badge-danger { background: var(--danger-dim); color: var(--danger); }
        .badge-info { background: var(--info-dim); color: var(--info); }

        /* ===== STATS GRID ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0.85rem;
            text-align: center;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .stat-label {
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 0.2rem;
        }

        /* ===== SCORING PANEL ===== */
        .score-display {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        .score-team-name {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.25rem;
        }
        .score-main {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.1;
        }
        .score-main span { font-size: 1.4rem; color: var(--text-secondary); }
        .score-overs {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.2rem;
        }
        .score-extras {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 0.35rem;
        }
        .score-crr {
            font-size: 0.82rem;
            color: var(--accent);
            margin-top: 0.2rem;
        }
        .score-target {
            font-size: 0.85rem;
            color: var(--warning);
            margin-top: 0.3rem;
            font-weight: 500;
        }

        .batsmen-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .batsman-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0.75rem;
        }
        .batsman-card.on-strike { border-color: var(--accent); }
        .batsman-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .strike-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
        }
        .batsman-stats {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 0.2rem;
        }

        .bowler-info {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0.75rem;
            margin-bottom: 1rem;
        }
        .bowler-name { font-size: 0.85rem; font-weight: 600; }
        .bowler-stats { font-size: 0.78rem; color: var(--text-secondary); margin-top: 0.2rem; }

        .run-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .run-btn {
            padding: 0.85rem 0.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }
        .run-btn:hover { background: var(--bg-hover); border-color: var(--border-light); }
        .run-btn:active { transform: scale(0.95); }
        .run-btn.four { color: var(--four-color); border-color: var(--four-color); }
        .run-btn.six { color: var(--six-color); border-color: var(--six-color); }

        .extra-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .extra-btn {
            padding: 0.6rem;
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        /* ===== THIS OVER ===== */
        .this-over {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            min-height: 42px;
            align-items: center;
        }
        .this-over-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 0.5rem;
        }
        .ball-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.72rem;
            font-weight: 600;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .ball-chip.dot { color: var(--text-muted); }
        .ball-chip.boundary { background: var(--success-dim); color: var(--success); border-color: var(--success); }
        .ball-chip.six-ball { background: var(--warning-dim); color: var(--warning); border-color: var(--warning); }
        .ball-chip.wicket-ball { background: var(--danger-dim); color: var(--danger); border-color: var(--danger); }
        .ball-chip.extra-ball { background: var(--info-dim); color: var(--info); border-color: var(--info); }

        /* ===== OVER HISTORY ===== */
        .over-summary {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0.6rem 0.75rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .over-number {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 50px;
        }
        .over-balls { display: flex; gap: 0.3rem; flex-wrap: wrap; flex: 1; }
        .over-runs { font-size: 0.8rem; font-weight: 600; color: var(--text-primary); min-width: 30px; text-align: right; }

        /* ===== PLAYER LIST ===== */
        .player-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        .player-item:last-child { border-bottom: none; }
        .player-number {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .player-name { flex: 1; font-size: 0.88rem; }
        .player-role { font-size: 0.72rem; color: var(--text-muted); }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }
        .modal-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .modal-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 1.25rem;
        }

        /* ===== SAVED MATCHES ===== */
        .match-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .match-item:hover { border-color: var(--border-light); background: var(--bg-hover); }
        .match-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .match-item-title { font-weight: 600; font-size: 0.9rem; }
        .match-item-date { font-size: 0.72rem; color: var(--text-muted); }
        .match-item-score { font-size: 0.82rem; color: var(--text-secondary); }
        .match-item-actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }

        /* ===== PARTNERSHIP ===== */
        .partnership-bar {
            height: 6px;
            background: var(--bg-input);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 0.3rem;
        }
        .partnership-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* ===== WAGON WHEEL (simplified) ===== */
        .over-by-over-chart {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 80px;
            padding: 0.5rem 0;
        }
        .over-bar {
            flex: 1;
            min-width: 8px;
            max-width: 24px;
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            border-radius: 2px 2px 0 0;
            transition: var(--transition);
            position: relative;
        }
        .over-bar:hover { background: rgba(107,138,173,0.3); }
        .over-bar-label {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6rem;
            color: var(--text-muted);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }
        .empty-state svg { width: 48px; height: 48px; fill: var(--text-muted); margin-bottom: 1rem; }
        .empty-state p { font-size: 0.9rem; margin-bottom: 1rem; }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0.65rem 1rem;
            font-size: 0.82rem;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: slideIn 0.3s ease;
            max-width: 320px;
        }
        .toast.success { border-left: 3px solid var(--success); }
        .toast.error { border-left: 3px solid var(--danger); }
        .toast.info { border-left: 3px solid var(--accent); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

        /* ===== FOOTER ===== */
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 1rem;
            text-align: center;
        }
        .footer-text {
            font-size: 0.78rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .footer-text strong { color: var(--text-secondary); font-weight: 600; }

        /* ===== FALL OF WICKETS ===== */
        .fow-item {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            margin-right: 1rem;
            margin-bottom: 0.4rem;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .fow-score { font-weight: 600; color: var(--danger); }

        /* ===== INNINGS TAB SWITCHER ===== */
        .innings-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 1rem;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .innings-tab {
            flex: 1;
            padding: 0.55rem 0.75rem;
            text-align: center;
            font-size: 0.82rem;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            background: none;
            border: none;
            font-family: inherit;
            font-weight: 500;
        }
        .innings-tab:not(:last-child) { border-right: 1px solid var(--border-color); }
        .innings-tab.active { background: var(--accent-dim); color: var(--accent); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            html { font-size: 14px; }
            .form-row { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .run-buttons { grid-template-columns: repeat(4, 1fr); }
            .extra-buttons { grid-template-columns: repeat(3, 1fr); }
            .header-inner { justify-content: center; }
            .card { padding: 1rem; }
            .batsmen-info { grid-template-columns: 1fr; }
            .score-main { font-size: 2.2rem; }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .run-buttons { grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
            .run-btn { padding: 0.7rem 0.35rem; font-size: 1rem; }
            .extra-buttons { grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
            .header-actions .btn span.btn-text { display: none; }
            .nav-tab { padding: 0.55rem 0.75rem; font-size: 0.78rem; }
        }

        /* ===== PRINT ===== */
        @media print {
            .header, .nav-tabs, .footer, .btn, .toast-container, .modal-overlay { display: none !important; }
            body { background: #fff; color: #000; }
            .card { border: 1px solid #ddd; box-shadow: none; background: #fff; }
            table th { background: #f5f5f5; }
            .stat-card { background: #f9f9f9; }
        }

        /* Dismissal type selector */
        .dismissal-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
        }
        .dismissal-btn {
            padding: 0.6rem;
            font-size: 0.8rem;
            text-align: center;
        }

        /* Confirmation highlight */
        .highlight-row { animation: rowHighlight 1s ease; }
        @keyframes rowHighlight { 0% { background: var(--accent-dim); } 100% { background: transparent; } }

        .section-divider {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 1rem 0;
        }

        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .gap-sm { gap: 0.5rem; }
        .mt-1 { margin-top: 1rem; }
        .mb-1 { margin-bottom: 1rem; }
    </style>
</head>

<script>
// =====================================================
// CRICKET SCORING SYSTEM — Complete Application Logic
// =====================================================

// --- Global State ---
let match = null;
let currentInnings = 0; // 0 = 1st innings, 1 = 2nd innings
let selectedWicketType = '';

// --- Storage Keys ---
const STORAGE_KEY = 'cricket_scorer_matches';
const CURRENT_MATCH_KEY = 'cricket_scorer_current';

// =====================================================
// PAGE NAVIGATION
// =====================================================
function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const page = document.getElementById('page-' + pageId);
    if (page) page.classList.add('active');

    // Show/hide nav tabs
    const navTabs = document.getElementById('navTabs');
    const matchPages = ['scoring', 'scorecard', 'overs', 'players', 'summary'];
    if (match && matchPages.includes(pageId)) {
        navTabs.style.display = 'block';
        document.querySelectorAll('.nav-tab').forEach(t => {
            t.classList.toggle('active', t.dataset.page === pageId);
        });
    } else {
        navTabs.style.display = 'none';
    }

    // Show/hide save/export buttons
    const btnSave = document.getElementById('btnSave');
    const btnExport = document.getElementById('btnExport');
    if (match) {
        btnSave.style.display = '';
        btnExport.style.display = '';
    } else {
        btnSave.style.display = 'none';
        btnExport.style.display = 'none';
    }

    // Page-specific rendering
    if (pageId === 'newMatch') setupNewMatchPage();
    if (pageId === 'scoring') renderScoring();
    if (pageId === 'scorecard') renderScorecard();
    if (pageId === 'overs') renderOverHistory();
    if (pageId === 'players') renderPlayers();
    if (pageId === 'summary') renderSummary();
    if (pageId === 'savedMatches') renderSavedMatches();
    if (pageId === 'home') renderHome();
}

// Nav tab clicks
document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.addEventListener('click', () => showPage(tab.dataset.page));
});

// =====================================================
// TOAST NOTIFICATIONS
// =====================================================
function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
    }, 2500);
}

// =====================================================
// MODAL HELPERS
// =====================================================
function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

// =====================================================
// NEW MATCH SETUP
// =====================================================
function setupNewMatchPage() {
    const teamAInput = document.getElementById('teamAName');
    const teamBInput = document.getElementById('teamBName');
    const tossSelect = document.getElementById('tossWon');
    const ppt = document.getElementById('playersPerTeam');

    // Update team labels & toss options dynamically
    const updateLabels = () => {
        const a = teamAInput.value || 'Team A';
        const b = teamBInput.value || 'Team B';
        document.getElementById('teamALabel').textContent = a;
        document.getElementById('teamBLabel').textContent = b;
        tossSelect.innerHTML = `<option value="">-- Select --</option><option value="A">${a}</option><option value="B">${b}</option>`;
    };
    teamAInput.addEventListener('input', updateLabels);
    teamBInput.addEventListener('input', updateLabels);
    updateLabels();

    const generatePlayerInputs = () => {
        const count = parseInt(ppt.value);
        ['A', 'B'].forEach(team => {
            const container = document.getElementById(`team${team}PlayerInputs`);
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const div = document.createElement('div');
                div.className = 'form-group';
                div.style.marginBottom = '0.5rem';
                div.innerHTML = `
                    <div style="display:flex; gap:0.5rem; align-items:center;">
                        <span class="player-number">${i + 1}</span>
                        <input type="text" class="form-input" placeholder="Player ${i + 1} name" id="player${team}_${i}" maxlength="25">
                        <select class="form-select" style="width:auto; min-width:100px;" id="role${team}_${i}">
                            <option value="Batsman">Batsman</option>
                            <option value="Bowler">Bowler</option>
                            <option value="All-Rounder">All-Rounder</option>
                            <option value="WK">Wicket Keeper</option>
                        </select>
                    </div>`;
                container.appendChild(div);
            }
        });
    };
    ppt.addEventListener('change', generatePlayerInputs);
    generatePlayerInputs();
}

// =====================================================
// START MATCH
// =====================================================
function startMatch() {
    const teamAName = document.getElementById('teamAName').value.trim() || 'Team A';
    const teamBName = document.getElementById('teamBName').value.trim() || 'Team B';
    const totalOvers = parseInt(document.getElementById('totalOvers').value) || 20;
    const ppt = parseInt(document.getElementById('playersPerTeam').value) || 11;
    const tossWon = document.getElementById('tossWon').value;
    const tossDecision = document.getElementById('tossDecision').value;
    const venue = document.getElementById('venue').value.trim();

    // Collect players
    const collectPlayers = (team) => {
        const players = [];
        for (let i = 0; i < ppt; i++) {
            const nameInput = document.getElementById(`player${team}_${i}`);
            const roleInput = document.getElementById(`role${team}_${i}`);
            const name = nameInput ? (nameInput.value.trim() || `Player ${i + 1}`) : `Player ${i + 1}`;
            const role = roleInput ? roleInput.value : 'Batsman';
            players.push(createPlayer(name, role, i));
        }
        return players;
    };

    const teamAPlayers = collectPlayers('A');
    const teamBPlayers = collectPlayers('B');

    // Determine batting/bowling order
    let battingFirst, bowlingFirst, battingFirstName, bowlingFirstName;
    if (tossWon === 'A') {
        if (tossDecision === 'bat') {
            battingFirst = teamAPlayers; bowlingFirst = teamBPlayers;
            battingFirstName = teamAName; bowlingFirstName = teamBName;
        } else {
            battingFirst = teamBPlayers; bowlingFirst = teamAPlayers;
            battingFirstName = teamBName; bowlingFirstName = teamAName;
        }
    } else if (tossWon === 'B') {
        if (tossDecision === 'bat') {
            battingFirst = teamBPlayers; bowlingFirst = teamAPlayers;
            battingFirstName = teamBName; bowlingFirstName = teamAName;
        } else {
            battingFirst = teamAPlayers; bowlingFirst = teamBPlayers;
            battingFirstName = teamAName; bowlingFirstName = teamBName;
        }
    } else {
        // Default: Team A bats first
        battingFirst = teamAPlayers; bowlingFirst = teamBPlayers;
        battingFirstName = teamAName; bowlingFirstName = teamBName;
    }

    match = {
        id: Date.now().toString(),
        createdAt: new Date().toISOString(),
        teamA: { name: teamAName, players: teamAPlayers },
        teamB: { name: teamBName, players: teamBPlayers },
        totalOvers: totalOvers,
        playersPerTeam: ppt,
        tossWon: tossWon === 'A' ? teamAName : (tossWon === 'B' ? teamBName : 'N/A'),
        tossDecision: tossDecision,
        venue: venue || 'Not specified',
        status: 'live', // live, completed
        result: '',
        innings: [
            createInnings(battingFirstName, bowlingFirstName, battingFirst, bowlingFirst, totalOvers),
            createInnings(bowlingFirstName, battingFirstName, bowlingFirst, battingFirst, totalOvers)
        ],
        currentInnings: 0
    };

    currentInnings = 0;

    // Auto-select first two batsmen and first bowler
    const inn = match.innings[0];
    inn.striker = 0;
    inn.nonStriker = 1;
    inn.battingOrder[0].status = 'batting';
    inn.battingOrder[1].status = 'batting';
    inn.currentBowlerIndex = 0;
    inn.bowlingCard[0].status = 'bowling';

    autoSaveMatch();
    showToast('Match started!', 'success');
    showPage('scoring');
}

function createPlayer(name, role, index) {
    return { name, role, index };
}

function createInnings(battingTeam, bowlingTeam, battingPlayers, bowlingPlayers, totalOvers) {
    return {
        battingTeam,
        bowlingTeam,
        totalOvers,
        totalRuns: 0,
        totalWickets: 0,
        totalBalls: 0,
        extras: { wides: 0, noBalls: 0, byes: 0, legByes: 0, total: 0 },
        battingOrder: battingPlayers.map((p, i) => ({
            name: p.name,
            role: p.role,
            runs: 0,
            balls: 0,
            fours: 0,
            sixes: 0,
            status: 'yet_to_bat', // yet_to_bat, batting, out, retired
            dismissal: '',
            dismissalBowler: '',
            dismissalFielder: '',
        })),
        bowlingCard: bowlingPlayers.map((p, i) => ({
            name: p.name,
            role: p.role,
            overs: 0,
            balls: 0,
            maidens: 0,
            runs: 0,
            wickets: 0,
            noBalls: 0,
            wides: 0,
            dots: 0,
            economy: 0,
            status: 'available', // available, bowling, done
            currentOverRuns: 0,
            currentOverBalls: 0,
        })),
        striker: -1,
        nonStriker: -1,
        currentBowlerIndex: -1,
        overHistory: [], // Array of overs, each over is array of ball objects
        currentOver: [],  // Current over balls
        fallOfWickets: [],
        partnerships: [],
        currentPartnership: { runs: 0, balls: 0 },
        isCompleted: false,
    };
}

// =====================================================
// SCORING ENGINE
// =====================================================
function getInnings() { return match.innings[currentInnings]; }

function addRuns(runs) {
    if (!match || match.status !== 'live') return;
    const inn = getInnings();
    if (inn.isCompleted) return;

    const striker = inn.battingOrder[inn.striker];
    const bowler = inn.bowlingCard[inn.currentBowlerIndex];

    // Record ball
    const ball = { type: 'run', runs, extras: 0, extraType: null, isLegal: true, batsmanIndex: inn.striker };
    inn.currentOver.push(ball);

    // Update batsman
    striker.runs += runs;
    striker.balls += 1;
    if (runs === 4) striker.fours += 1;
    if (runs === 6) striker.sixes += 1;

    // Update innings
    inn.totalRuns += runs;
    inn.totalBalls += 1;

    // Update bowler
    bowler.runs += runs;
    bowler.balls += 1;
    if (runs === 0) bowler.dots += 1;

    // Partnership
    inn.currentPartnership.runs += runs;
    inn.currentPartnership.balls += 1;

    // Odd runs = swap strike
    if (runs % 2 !== 0) swapStrikeInternal(inn);

    checkOverComplete(inn);
    checkInningsEnd(inn);
    renderScoring();
    autoSaveMatch();
}

function addExtra(type) {
    if (!match || match.status !== 'live') return;
    const inn = getInnings();
    if (inn.isCompleted) return;

    const bowler = inn.bowlingCard[inn.currentBowlerIndex];
    let ball = { type: 'extra', runs: 0, extras: 1, extraType: type, isLegal: false, batsmanIndex: inn.striker };

    if (type === 'wide') {
        inn.extras.wides += 1;
        inn.extras.total += 1;
        inn.totalRuns += 1;
        bowler.runs += 1;
        bowler.wides += 1;
        ball.isLegal = false;
    } else if (type === 'noBall') {
        inn.extras.noBalls += 1;
        inn.extras.total += 1;
        inn.totalRuns += 1;
        bowler.runs += 1;
        bowler.noBalls += 1;
        // Batsman gets to face the ball, add to balls faced
        inn.battingOrder[inn.striker].balls += 1;
        ball.isLegal = false;
    } else if (type === 'bye') {
        inn.extras.byes += 1;
        inn.extras.total += 1;
        inn.totalRuns += 1;
        inn.totalBalls += 1;
        bowler.balls += 1;
        ball.isLegal = true;
        ball.extras = 1;
        inn.battingOrder[inn.striker].balls += 1;
        // Swap strike for odd extras
        swapStrikeInternal(inn);
    } else if (type === 'legBye') {
        inn.extras.legByes += 1;
        inn.extras.total += 1;
        inn.totalRuns += 1;
        inn.totalBalls += 1;
        bowler.balls += 1;
        ball.isLegal = true;
        ball.extras = 1;
        inn.battingOrder[inn.striker].balls += 1;
        swapStrikeInternal(inn);
    }

    inn.currentOver.push(ball);
    inn.currentPartnership.runs += ball.extras;
    if (ball.isLegal) inn.currentPartnership.balls += 1;

    if (ball.isLegal) checkOverComplete(inn);
    checkInningsEnd(inn);
    renderScoring();
    autoSaveMatch();
}

function showWicketModal() {
    if (!match || match.status !== 'live') return;
    const inn = getInnings();
    if (inn.isCompleted) return;

    selectedWicketType = '';

    // Populate fielder dropdown from bowling team
    const fielderSelect = document.getElementById('wicketFielder');
    fielderSelect.innerHTML = '<option value="">-- Select --</option>';
    inn.bowlingCard.forEach((b, i) => {
        fielderSelect.innerHTML += `<option value="${i}">${b.name}</option>`;
    });

    // Run out batsman selection
    const runOutSelect = document.getElementById('runOutBatsman');
    runOutSelect.innerHTML = '';
    const strikerName = inn.battingOrder[inn.striker].name;
    const nonStrikerName = inn.battingOrder[inn.nonStriker].name;
    runOutSelect.innerHTML = `
        <option value="striker">${strikerName} (Striker)</option>
        <option value="nonStriker">${nonStrikerName} (Non-Striker)</option>`;

    document.getElementById('wicketRunOutBatsman').style.display = 'none';
    document.getElementById('wicketModal').classList.add('active');
}

function addWicket(type) {
    selectedWicketType = type;
    document.querySelectorAll('.dismissal-btn').forEach(b => {
        b.classList.toggle('btn-danger', b.textContent === type);
    });
    document.getElementById('wicketRunOutBatsman').style.display = type === 'Run Out' ? 'block' : 'none';
}

function confirmWicket() {
    if (!selectedWicketType) {
        showToast('Please select a dismissal type', 'error');
        return;
    }
    const inn = getInnings();
    const bowler = inn.bowlingCard[inn.currentBowlerIndex];
    const fielderIdx = document.getElementById('wicketFielder').value;
    const fielderName = fielderIdx !== '' ? inn.bowlingCard[fielderIdx].name : '';

    let outBatsmanIndex = inn.striker;

    if (selectedWicketType === 'Run Out') {
        const who = document.getElementById('runOutBatsman').value;
        outBatsmanIndex = who === 'striker' ? inn.striker : inn.nonStriker;
    }

    const outBatsman = inn.battingOrder[outBatsmanIndex];

    // Ball record
    const ball = { type: 'wicket', runs: 0, extras: 0, extraType: null, isLegal: true, batsmanIndex: outBatsmanIndex, dismissal: selectedWicketType };
    inn.currentOver.push(ball);

    // Update batsman
    outBatsman.status = 'out';
    outBatsman.dismissal = selectedWicketType;
    outBatsman.dismissalBowler = bowler.name;
    outBatsman.dismissalFielder = fielderName;
    if (outBatsmanIndex === inn.striker) {
        outBatsman.balls += 1;
    }

    // Update innings
    inn.totalWickets += 1;
    inn.totalBalls += 1;

    // Update bowler (run out doesn't count as bowler's wicket)
    bowler.balls += 1;
    if (selectedWicketType !== 'Run Out') {
        bowler.wickets += 1;
    }

    // Fall of wicket
    inn.fallOfWickets.push({
        wicket: inn.totalWickets,
        score: inn.totalRuns,
        overs: formatOvers(inn.totalBalls),
        batsmanName: outBatsman.name,
        batsmanRuns: outBatsman.runs,
    });

    // End partnership, start new one
    inn.partnerships.push({ ...inn.currentPartnership, endedBy: outBatsman.name });
    inn.currentPartnership = { runs: 0, balls: 0 };

    closeModal('wicketModal');

    // Check if all out
    if (inn.totalWickets >= inn.battingOrder.length - 1) {
        inn.isCompleted = true;
        checkOverComplete(inn);
        handleInningsEnd();
    } else {
        // Need new batsman
        checkOverComplete(inn);
        showNewBatsmanModal(outBatsmanIndex);
    }

    renderScoring();
    autoSaveMatch();
}

function showNewBatsmanModal(outBatsmanIndex) {
    const inn = getInnings();
    const list = document.getElementById('newBatsmanList');
    list.innerHTML = '';

    inn.battingOrder.forEach((b, i) => {
        if (b.status === 'yet_to_bat') {
            const div = document.createElement('div');
            div.className = 'player-item';
            div.innerHTML = `
                <input type="radio" name="newBatsman" value="${i}" id="nb_${i}" style="accent-color:var(--accent);">
                <label for="nb_${i}" style="cursor:pointer; flex:1;">
                    <div class="player-name">${b.name}</div>
                    <div class="player-role">${b.role}</div>
                </label>`;
            list.appendChild(div);
        }
    });

    // Auto-select first available
    const firstRadio = list.querySelector('input[type=radio]');
    if (firstRadio) firstRadio.checked = true;

    document.getElementById('newBatsmanModal').classList.add('active');

    // Adjust which end the new batsman goes to
    const inn2 = getInnings();
    if (outBatsmanIndex === inn2.striker) {
        window._replaceEnd = 'striker';
    } else {
        window._replaceEnd = 'nonStriker';
    }
}

function confirmNewBatsman() {
    const selected = document.querySelector('input[name="newBatsman"]:checked');
    if (!selected) {
        showToast('Please select a batsman', 'error');
        return;
    }
    const idx = parseInt(selected.value);
    const inn = getInnings();
    inn.battingOrder[idx].status = 'batting';

    if (window._replaceEnd === 'striker') {
        inn.striker = idx;
    } else {
        inn.nonStriker = idx;
    }

    closeModal('newBatsmanModal');
    renderScoring();
    autoSaveMatch();
}

function swapStrike() {
    if (!match || match.status !== 'live') return;
    const inn = getInnings();
    swapStrikeInternal(inn);
    renderScoring();
}

function swapStrikeInternal(inn) {
    const temp = inn.striker;
    inn.striker = inn.nonStriker;
    inn.nonStriker = temp;
}

function retireBatsman() {
    if (!match) return;
    const inn = getInnings();
    if (inn.isCompleted) return;

    inn.battingOrder[inn.striker].status = 'retired';
    const outIdx = inn.striker;
    showNewBatsmanModal(outIdx);
    window._replaceEnd = 'striker';
}

function changeBowler() {
    if (!match) return;
    showBowlerModal();
}

function showBowlerModal() {
    const inn = getInnings();
    const list = document.getElementById('newBowlerList');
    list.innerHTML = '';

    // Can't bowl the same bowler who just bowled the last over (consecutive overs rule)
    const lastBowlerIdx = inn.currentBowlerIndex;

    inn.bowlingCard.forEach((b, i) => {
        const maxOvers = inn.totalOvers;
        const bowlerOvers = Math.floor(b.balls / 6);
        const canBowl = bowlerOvers < Math.ceil(maxOvers / inn.bowlingCard.length * 2) && i !== lastBowlerIdx;
        const div = document.createElement('div');
        div.className = 'player-item';
        div.innerHTML = `
            <input type="radio" name="newBowler" value="${i}" id="bw_${i}" ${!canBowl ? 'disabled' : ''} style="accent-color:var(--accent);">
            <label for="bw_${i}" style="cursor:pointer; flex:1; ${!canBowl ? 'opacity:0.5;' : ''}">
                <div class="player-name">${b.name}</div>
                <div class="player-role">${formatBowlerOvers(b.balls)}-${b.maidens}-${b.runs}-${b.wickets}</div>
            </label>`;
        list.appendChild(div);
    });

    document.getElementById('newBowlerModal').classList.add('active');
}

function confirmNewBowler() {
    const selected = document.querySelector('input[name="newBowler"]:checked');
    if (!selected) {
        showToast('Please select a bowler', 'error');
        return;
    }
    const idx = parseInt(selected.value);
    const inn = getInnings();
    inn.currentBowlerIndex = idx;
    inn.bowlingCard[idx].status = 'bowling';
    inn.bowlingCard[idx].currentOverRuns = 0;
    inn.bowlingCard[idx].currentOverBalls = 0;
    closeModal('newBowlerModal');
    renderScoring();
    autoSaveMatch();
}

function checkOverComplete(inn) {
    const legalBalls = inn.currentOver.filter(b => b.isLegal).length;
    if (legalBalls >= 6) {
        // Check maiden
        const bowler = inn.bowlingCard[inn.currentBowlerIndex];
        const overRuns = inn.currentOver.reduce((sum, b) => sum + b.runs + (b.extraType === 'wide' || b.extraType === 'noBall' ? b.extras : 0), 0);
        if (overRuns === 0) bowler.maidens += 1;

        // Save over to history
        inn.overHistory.push([...inn.currentOver]);
        inn.currentOver = [];

        // Swap strike at end of over
        swapStrikeInternal(inn);

        // Prompt for new bowler if innings not complete
        if (!inn.isCompleted) {
            setTimeout(() => showBowlerModal(), 100);
        }
    }
}

function checkInningsEnd(inn) {
    // All out
    if (inn.totalWickets >= inn.battingOrder.length - 1) {
        inn.isCompleted = true;
        handleInningsEnd();
        return;
    }
    // Overs complete
    if (inn.totalBalls >= inn.totalOvers * 6) {
        inn.isCompleted = true;
        handleInningsEnd();
        return;
    }
    // Target chased (2nd innings)
    if (currentInnings === 1) {
        const target = match.innings[0].totalRuns + 1;
        if (inn.totalRuns >= target) {
            inn.isCompleted = true;
            handleInningsEnd();
            return;
        }
    }
}

function handleInningsEnd() {
    const inn = getInnings();
    // Save any remaining over
    if (inn.currentOver.length > 0) {
        inn.overHistory.push([...inn.currentOver]);
        inn.currentOver = [];
    }
    // Save current partnership
    if (inn.currentPartnership.runs > 0 || inn.currentPartnership.balls > 0) {
        inn.partnerships.push({ ...inn.currentPartnership, endedBy: 'Innings End' });
    }

    if (currentInnings === 0) {
        // Move to 2nd innings
        showEndInningsDialog();
    } else {
        // Match complete
        determineResult();
        match.status = 'completed';
        showEndInningsDialog();
    }
    autoSaveMatch();
}

function showEndInningsDialog() {
    const title = document.getElementById('endInningsTitle');
    const msg = document.getElementById('endInningsMessage');
    const actions = document.getElementById('endInningsActions');

    if (currentInnings === 0) {
        const inn = getInnings();
        title.textContent = 'End of 1st Innings';
        msg.textContent = `${inn.battingTeam} scored ${inn.totalRuns}/${inn.totalWickets} in ${formatOvers(inn.totalBalls)} overs. ${inn.bowlingTeam} needs ${inn.totalRuns + 1} runs to win.`;
        actions.innerHTML = `<button class="btn btn-primary" onclick="startSecondInnings()">Start 2nd Innings</button>`;
    } else {
        title.textContent = 'Match Completed';
        msg.textContent = match.result;
        actions.innerHTML = `
            <button class="btn" onclick="closeModal('endInningsModal'); showPage('summary');">View Summary</button>
            <button class="btn btn-primary" onclick="closeModal('endInningsModal'); showPage('home');">Home</button>`;
    }

    document.getElementById('endInningsModal').classList.add('active');
}

function endInnings() {
    if (!match) return;
    if (confirm('Are you sure you want to end this innings?')) {
        const inn = getInnings();
        inn.isCompleted = true;
        handleInningsEnd();
    }
}

function startSecondInnings() {
    closeModal('endInningsModal');
    currentInnings = 1;
    match.currentInnings = 1;

    const inn = match.innings[1];
    inn.striker = 0;
    inn.nonStriker = 1;
    inn.battingOrder[0].status = 'batting';
    inn.battingOrder[1].status = 'batting';
    inn.currentBowlerIndex = 0;
    inn.bowlingCard[0].status = 'bowling';

    renderScoring();
    autoSaveMatch();
    showToast('2nd Innings started!', 'info');
}

function determineResult() {
    const inn1 = match.innings[0];
    const inn2 = match.innings[1];

    if (inn2.totalRuns > inn1.totalRuns) {
        const wicketsRemaining = inn2.battingOrder.length - 1 - inn2.totalWickets;
        match.result = `${inn2.battingTeam} won by ${wicketsRemaining} wicket${wicketsRemaining !== 1 ? 's' : ''}`;
    } else if (inn1.totalRuns > inn2.totalRuns) {
        const runDiff = inn1.totalRuns - inn2.totalRuns;
        match.result = `${inn1.battingTeam} won by ${runDiff} run${runDiff !== 1 ? 's' : ''}`;
    } else {
        match.result = 'Match Tied';
    }
}

function undoLastBall() {
    if (!match || match.status !== 'live') return;
    const inn = getInnings();

    let lastBall = null;
    if (inn.currentOver.length > 0) {
        lastBall = inn.currentOver.pop();
    } else if (inn.overHistory.length > 0) {
        // Undo from previous over
        inn.currentOver = inn.overHistory.pop();
        lastBall = inn.currentOver.pop();
    }

    if (!lastBall) {
        showToast('Nothing to undo', 'error');
        return;
    }

    // Reverse the ball
    if (lastBall.type === 'run') {
        const batsman = inn.battingOrder[lastBall.batsmanIndex];
        batsman.runs -= lastBall.runs;
        batsman.balls -= 1;
        if (lastBall.runs === 4) batsman.fours -= 1;
        if (lastBall.runs === 6) batsman.sixes -= 1;
        inn.totalRuns -= lastBall.runs;
        inn.totalBalls -= 1;
        const bowler = inn.bowlingCard[inn.currentBowlerIndex];
        bowler.runs -= lastBall.runs;
        bowler.balls -= 1;
        if (lastBall.runs === 0) bowler.dots -= 1;
        if (lastBall.runs % 2 !== 0) swapStrikeInternal(inn);
        inn.currentPartnership.runs -= lastBall.runs;
        inn.currentPartnership.balls -= 1;
    } else if (lastBall.type === 'extra') {
        if (lastBall.extraType === 'wide') {
            inn.extras.wides -= 1; inn.extras.total -= 1; inn.totalRuns -= 1;
            inn.bowlingCard[inn.currentBowlerIndex].runs -= 1;
            inn.bowlingCard[inn.currentBowlerIndex].wides -= 1;
        } else if (lastBall.extraType === 'noBall') {
            inn.extras.noBalls -= 1; inn.extras.total -= 1; inn.totalRuns -= 1;
            inn.bowlingCard[inn.currentBowlerIndex].runs -= 1;
            inn.bowlingCard[inn.currentBowlerIndex].noBalls -= 1;
            inn.battingOrder[lastBall.batsmanIndex].balls -= 1;
        } else if (lastBall.extraType === 'bye' || lastBall.extraType === 'legBye') {
            inn.extras[lastBall.extraType === 'bye' ? 'byes' : 'legByes'] -= 1;
            inn.extras.total -= 1; inn.totalRuns -= 1; inn.totalBalls -= 1;
            inn.bowlingCard[inn.currentBowlerIndex].balls -= 1;
            inn.battingOrder[lastBall.batsmanIndex].balls -= 1;
            swapStrikeInternal(inn);
        }
        inn.currentPartnership.runs -= lastBall.extras;
        if (lastBall.isLegal) inn.currentPartnership.balls -= 1;
    } else if (lastBall.type === 'wicket') {
        const batsman = inn.battingOrder[lastBall.batsmanIndex];
        batsman.status = 'batting';
        batsman.dismissal = '';
        batsman.dismissalBowler = '';
        batsman.dismissalFielder = '';
        if (lastBall.batsmanIndex === inn.striker) batsman.balls -= 1;
        inn.totalWickets -= 1;
        inn.totalBalls -= 1;
        inn.bowlingCard[inn.currentBowlerIndex].balls -= 1;
        if (lastBall.dismissal !== 'Run Out') inn.bowlingCard[inn.currentBowlerIndex].wickets -= 1;
        if (inn.fallOfWickets.length > 0) inn.fallOfWickets.pop();
        if (inn.partnerships.length > 0) {
            const lastPartnership = inn.partnerships.pop();
            inn.currentPartnership = lastPartnership;
        }
        inn.isCompleted = false;
    }

    showToast('Last ball undone', 'info');
    renderScoring();
    autoSaveMatch();
}

// =====================================================
// RENDERING — LIVE SCORING
// =====================================================
function renderScoring() {
    if (!match) return;
    const inn = getInnings();

    // Score Display
    const scoreDisplay = document.getElementById('scoreDisplay');
    const crr = inn.totalBalls > 0 ? (inn.totalRuns / (inn.totalBalls / 6)).toFixed(2) : '0.00';
    let targetHTML = '';
    if (currentInnings === 1) {
        const target = match.innings[0].totalRuns + 1;
        const needed = target - inn.totalRuns;
        const ballsLeft = (inn.totalOvers * 6) - inn.totalBalls;
        const rrr = ballsLeft > 0 ? (needed / (ballsLeft / 6)).toFixed(2) : '0.00';
        targetHTML = `<div class="score-target">Target: ${target} | Need ${needed} from ${ballsLeft} balls | RRR: ${rrr}</div>`;
    }
    scoreDisplay.innerHTML = `
        <div class="score-team-name">${inn.battingTeam}</div>
        <div class="score-main">${inn.totalRuns}<span>/${inn.totalWickets}</span></div>
        <div class="score-overs">Overs: ${formatOvers(inn.totalBalls)} / ${inn.totalOvers}</div>
        <div class="score-extras">Extras: ${inn.extras.total} (WD ${inn.extras.wides}, NB ${inn.extras.noBalls}, B ${inn.extras.byes}, LB ${inn.extras.legByes})</div>
        <div class="score-crr">CRR: ${crr}</div>
        ${targetHTML}`;

    // Batsmen Info
    const batsmenInfo = document.getElementById('batsmenInfo');
    if (inn.striker >= 0 && inn.nonStriker >= 0) {
        const s = inn.battingOrder[inn.striker];
        const ns = inn.battingOrder[inn.nonStriker];
        batsmenInfo.innerHTML = `
            <div class="batsman-card on-strike">
                <div class="batsman-name"><span class="strike-dot"></span>${s.name}</div>
                <div class="batsman-stats">${s.runs} (${s.balls}) | 4s: ${s.fours} | 6s: ${s.sixes} | SR: ${s.balls > 0 ? (s.runs / s.balls * 100).toFixed(1) : '0.0'}</div>
            </div>
            <div class="batsman-card">
                <div class="batsman-name">${ns.name}</div>
                <div class="batsman-stats">${ns.runs} (${ns.balls}) | 4s: ${ns.fours} | 6s: ${ns.sixes} | SR: ${ns.balls > 0 ? (ns.runs / ns.balls * 100).toFixed(1) : '0.0'}</div>
            </div>`;
    }

    // Bowler Info
    const bowlerInfo = document.getElementById('bowlerInfo');
    if (inn.currentBowlerIndex >= 0) {
        const b = inn.bowlingCard[inn.currentBowlerIndex];
        bowlerInfo.innerHTML = `
            <div class="bowler-name">${b.name}</div>
            <div class="bowler-stats">${formatBowlerOvers(b.balls)}-${b.maidens}-${b.runs}-${b.wickets} | Econ: ${b.balls > 0 ? (b.runs / (b.balls / 6)).toFixed(2) : '0.00'} | NB: ${b.noBalls} | WD: ${b.wides}</div>`;
    }

    // This Over
    const thisOver = document.getElementById('thisOver');
    thisOver.innerHTML = '<span class="this-over-label">This Over</span>';
    inn.currentOver.forEach(ball => {
        const chip = document.createElement('span');
        chip.className = 'ball-chip';
        if (ball.type === 'wicket') {
            chip.classList.add('wicket-ball');
            chip.textContent = 'W';
        } else if (ball.type === 'extra') {
            chip.classList.add('extra-ball');
            if (ball.extraType === 'wide') chip.textContent = 'WD';
            else if (ball.extraType === 'noBall') chip.textContent = 'NB';
            else if (ball.extraType === 'bye') chip.textContent = 'B';
            else if (ball.extraType === 'legBye') chip.textContent = 'LB';
        } else {
            if (ball.runs === 0) { chip.classList.add('dot'); chip.textContent = '·'; }
            else if (ball.runs === 4) { chip.classList.add('boundary'); chip.textContent = '4'; }
            else if (ball.runs === 6) { chip.classList.add('six-ball'); chip.textContent = '6'; }
            else chip.textContent = ball.runs;
        }
        thisOver.appendChild(chip);
    });
}

// =====================================================
// RENDERING — SCORECARD
// =====================================================
function renderScorecard() {
    if (!match) return;

    const tabs = document.getElementById('scorecardInningsTabs');
    tabs.innerHTML = '';
    match.innings.forEach((inn, i) => {
        if (inn.totalBalls > 0 || i === currentInnings) {
            const btn = document.createElement('button');
            btn.className = `innings-tab ${i === 0 ? 'active' : ''}`;
            btn.textContent = `${inn.battingTeam} Innings`;
            btn.onclick = () => {
                tabs.querySelectorAll('.innings-tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                renderScorecardContent(i);
            };
            tabs.appendChild(btn);
        }
    });

    renderScorecardContent(currentInnings);
}

function renderScorecardContent(inningsIdx) {
    const inn = match.innings[inningsIdx];
    const content = document.getElementById('scorecardContent');

    // Batting Card
    let battingHTML = `
        <div class="card">
            <div class="card-title">${inn.battingTeam} — Batting <span class="badge badge-accent">${inn.totalRuns}/${inn.totalWickets} (${formatOvers(inn.totalBalls)})</span></div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Batsman</th>
                            <th class="text-center">R</th>
                            <th class="text-center">B</th>
                            <th class="text-center">4s</th>
                            <th class="text-center">6s</th>
                            <th class="text-center">SR</th>
                            <th>Dismissal</th>
                        </tr>
                    </thead>
                    <tbody>`;

    inn.battingOrder.forEach(b => {
        let dismissalText = '';
        if (b.status === 'out') {
            dismissalText = b.dismissal;
            if (b.dismissalFielder) dismissalText += ` (${b.dismissalFielder})`;
            if (b.dismissalBowler && b.dismissal !== 'Run Out') dismissalText += ` b ${b.dismissalBowler}`;
        } else if (b.status === 'batting') {
            dismissalText = '<span class="badge badge-success">not out</span>';
        } else if (b.status === 'retired') {
            dismissalText = '<span class="badge badge-warning">retired</span>';
        } else {
            dismissalText = '<span class="text-muted">DNB</span>';
        }

        const sr = b.balls > 0 ? (b.runs / b.balls * 100).toFixed(1) : '0.0';
        battingHTML += `
            <tr>
                <td><strong>${b.name}</strong></td>
                <td class="text-center"><strong>${b.runs}</strong></td>
                <td class="text-center">${b.balls}</td>
                <td class="text-center">${b.fours}</td>
                <td class="text-center">${b.sixes}</td>
                <td class="text-center">${sr}</td>
                <td>${dismissalText}</td>
            </tr>`;
    });

    battingHTML += `
                    </tbody>
                </table>
            </div>
            <div style="margin-top:0.75rem; font-size:0.8rem; color:var(--text-secondary);">
                <strong>Extras:</strong> ${inn.extras.total} (WD ${inn.extras.wides}, NB ${inn.extras.noBalls}, B ${inn.extras.byes}, LB ${inn.extras.legByes})
            </div>
            <div style="font-size:0.85rem; font-weight:600; margin-top:0.5rem;">
                Total: ${inn.totalRuns}/${inn.totalWickets} (${formatOvers(inn.totalBalls)} Overs)
            </div>
        </div>`;

    // Bowling Card
    let bowlingHTML = `
        <div class="card">
            <div class="card-title">${inn.bowlingTeam} — Bowling</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Bowler</th>
                            <th class="text-center">O</th>
                            <th class="text-center">M</th>
                            <th class="text-center">R</th>
                            <th class="text-center">W</th>
                            <th class="text-center">NB</th>
                            <th class="text-center">WD</th>
                            <th class="text-center">Dots</th>
                            <th class="text-center">Econ</th>
                        </tr>
                    </thead>
                    <tbody>`;

    inn.bowlingCard.forEach(b => {
        if (b.balls > 0) {
            const econ = b.balls > 0 ? (b.runs / (b.balls / 6)).toFixed(2) : '0.00';
            bowlingHTML += `
                <tr>
                    <td><strong>${b.name}</strong></td>
                    <td class="text-center">${formatBowlerOvers(b.balls)}</td>
                    <td class="text-center">${b.maidens}</td>
                    <td class="text-center">${b.runs}</td>
                    <td class="text-center"><strong>${b.wickets}</strong></td>
                    <td class="text-center">${b.noBalls}</td>
                    <td class="text-center">${b.wides}</td>
                    <td class="text-center">${b.dots}</td>
                    <td class="text-center">${econ}</td>
                </tr>`;
        }
    });

    bowlingHTML += `</tbody></table></div></div>`;

    // Fall of Wickets
    let fowHTML = '';
    if (inn.fallOfWickets.length > 0) {
        fowHTML = `<div class="card"><div class="card-title">Fall of Wickets</div><div>`;
        inn.fallOfWickets.forEach(f => {
            fowHTML += `<span class="fow-item"><span class="fow-score">${f.score}/${f.wicket}</span> (${f.batsmanName} ${f.batsmanRuns}, ${f.overs} ov)</span>`;
        });
        fowHTML += '</div></div>';
    }

    // Partnerships
    let partnerHTML = '';
    if (inn.partnerships.length > 0) {
        partnerHTML = `<div class="card"><div class="card-title">Partnerships</div>`;
        const maxPartnership = Math.max(...inn.partnerships.map(p => p.runs), 1);
        inn.partnerships.forEach((p, i) => {
            const pct = (p.runs / maxPartnership * 100).toFixed(0);
            partnerHTML += `
                <div style="margin-bottom:0.6rem;">
                    <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
                        <span>${ordinal(i + 1)} Wicket</span>
                        <span>${p.runs} (${p.balls})</span>
                    </div>
                    <div class="partnership-bar"><div class="partnership-fill" style="width:${pct}%"></div></div>
                </div>`;
        });
        partnerHTML += '</div>';
    }

    content.innerHTML = battingHTML + bowlingHTML + fowHTML + partnerHTML;
}

function renderOverHistory() {
    if (!match) return;

    const tabs = document.getElementById('oversInningsTabs');
    tabs.innerHTML = '';
    match.innings.forEach((inn, i) => {
        if (inn.overHistory.length > 0 || i === currentInnings) {
            const btn = document.createElement('button');
            btn.className = `innings-tab ${i === 0 ? 'active' : ''}`;
            btn.textContent = `${inn.battingTeam} Innings`;
            btn.onclick = () => {
                tabs.querySelectorAll('.innings-tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                renderOversContent(i);
            };
            tabs.appendChild(btn);
        }
    });

    renderOversContent(currentInnings);
}

function renderOversContent(inningsIdx) {
    const inn = match.innings[inningsIdx];
    const content = document.getElementById('oversContent');

    if (inn.overHistory.length === 0 && inn.currentOver.length === 0) {
        content.innerHTML = '<div class="empty-state"><p>No overs bowled yet.</p></div>';
        return;
    }

    let html = '<div class="card"><div class="card-title">Over-by-Over Breakdown</div>';

    // Over-by-over chart
    if (inn.overHistory.length > 0) {
        const overRuns = inn.overHistory.map(over => over.reduce((s, b) => s + b.runs + b.extras, 0));
        const maxRuns = Math.max(...overRuns, 1);
        html += '<div class="over-by-over-chart">';
        overRuns.forEach((r, i) => {
            const height = (r / maxRuns * 100).toFixed(0);
            html += `<div class="over-bar" style="height:${Math.max(height, 5)}%;" title="Over ${i + 1}: ${r} runs"><div class="over-bar-label">${i + 1}</div></div>`;
        });
        html += '</div><hr class="section-divider">';
    }

    // Detailed over history
    inn.overHistory.forEach((over, i) => {
        const overRuns = over.reduce((s, b) => s + b.runs + b.extras, 0);
        html += `<div class="over-summary"><span class="over-number">Over ${i + 1}</span><div class="over-balls">`;
        over.forEach(ball => {
            let cls = 'ball-chip';
            let text = '';
            if (ball.type === 'wicket') { cls += ' wicket-ball'; text = 'W'; }
            else if (ball.type === 'extra') {
                cls += ' extra-ball';
                if (ball.extraType === 'wide') text = 'WD';
                else if (ball.extraType === 'noBall') text = 'NB';
                else if (ball.extraType === 'bye') text = 'B';
                else text = 'LB';
            } else {
                if (ball.runs === 0) { cls += ' dot'; text = '·'; }
                else if (ball.runs === 4) { cls += ' boundary'; text = '4'; }
                else if (ball.runs === 6) { cls += ' six-ball'; text = '6'; }
                else text = ball.runs;
            }
            html += `<span class="${cls}">${text}</span>`;
        });
        html += `</div><span class="over-runs">${overRuns}</span></div>`;
    });

    // Current over if any
    if (inn.currentOver.length > 0) {
        html += `<div class="over-summary" style="border-color:var(--accent);"><span class="over-number" style="color:var(--accent);">Current</span><div class="over-balls">`;
        inn.currentOver.forEach(ball => {
            let cls = 'ball-chip';
            let text = '';
            if (ball.type === 'wicket') { cls += ' wicket-ball'; text = 'W'; }
            else if (ball.type === 'extra') {
                cls += ' extra-ball';
                if (ball.extraType === 'wide') text = 'WD';
                else if (ball.extraType === 'noBall') text = 'NB';
                else if (ball.extraType === 'bye') text = 'B';
                else text = 'LB';
            } else {
                if (ball.runs === 0) { cls += ' dot'; text = '·'; }
                else if (ball.runs === 4) { cls += ' boundary'; text = '4'; }
                else if (ball.runs === 6) { cls += ' six-ball'; text = '6'; }
                else text = ball.runs;
            }
            html += `<span class="${cls}">${text}</span>`;
        });
        const currentOverRuns = inn.currentOver.reduce((s, b) => s + b.runs + b.extras, 0);
        html += `</div><span class="over-runs">${currentOverRuns}</span></div>`;
    }

    html += '</div>';
    content.innerHTML = html;
}

// =====================================================
// SAVE / LOAD / EXPORT
// =====================================================
function autoSaveMatch() {
    if (!match) return;
    localStorage.setItem(CURRENT_MATCH_KEY, JSON.stringify(match));
}

function saveCurrentMatch() {
    if (!match) return;
    let saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const existing = saved.findIndex(m => m.id === match.id);
    if (existing >= 0) {
        saved[existing] = match;
    } else {
        saved.unshift(match);
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    showToast('Match saved successfully!', 'success');
}

function loadMatch(id) {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const found = saved.find(m => m.id === id);
    if (found) {
        match = found;
        currentInnings = match.currentInnings || 0;
        autoSaveMatch();
        showToast('Match loaded!', 'success');
        if (match.status === 'completed') {
            showPage('summary');
        } else {
            showPage('scoring');
        }
    }
}

function deleteMatch(id) {
    if (!confirm('Are you sure you want to delete this match?')) return;
    let saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    saved = saved.filter(m => m.id !== id);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    if (match && match.id === id) {
        match = null;
        localStorage.removeItem(CURRENT_MATCH_KEY);
    }
    renderSavedMatches();
    renderHome();
    showToast('Match deleted', 'info');
}

function clearAllSavedMatches() {
    if (!confirm('Delete all saved matches? This cannot be undone.')) return;
    localStorage.removeItem(STORAGE_KEY);
    renderSavedMatches();
    renderHome();
    showToast('All saved matches cleared', 'info');
}

function exportMatch() {
    if (!match) return;

    let text = '='.repeat(60) + '\n';
    text += '            CRICKET MATCH SCORECARD\n';
    text += '='.repeat(60) + '\n\n';
    text += `Match: ${match.teamA.name} vs ${match.teamB.name}\n`;
    text += `Venue: ${match.venue}\n`;
    text += `Overs: ${match.totalOvers}\n`;
    text += `Toss: ${match.tossWon} (elected to ${match.tossDecision})\n`;
    text += `Date: ${new Date(match.createdAt).toLocaleDateString()}\n`;
    if (match.result) text += `Result: ${match.result}\n`;
    text += '\n';

    match.innings.forEach((inn, idx) => {
        if (inn.totalBalls === 0) return;
        text += '-'.repeat(60) + '\n';
        text += `${inn.battingTeam} INNINGS (${inn.totalRuns}/${inn.totalWickets}, ${formatOvers(inn.totalBalls)} Ov)\n`;
        text += '-'.repeat(60) + '\n\n';

        text += 'BATTING\n';
        text += padStr('Batsman', 20) + padStr('R', 6) + padStr('B', 6) + padStr('4s', 5) + padStr('6s', 5) + padStr('SR', 8) + 'Dismissal\n';
        text += '-'.repeat(70) + '\n';

        inn.battingOrder.forEach(b => {
            if (b.status === 'yet_to_bat') return;
            let dismissal = b.status === 'out' ? b.dismissal : (b.status === 'batting' ? 'not out' : b.status);
            if (b.dismissalFielder) dismissal += ` (${b.dismissalFielder})`;
            if (b.dismissalBowler && b.dismissal !== 'Run Out') dismissal += ` b ${b.dismissalBowler}`;
            const sr = b.balls > 0 ? (b.runs / b.balls * 100).toFixed(1) : '0.0';
            text += padStr(b.name, 20) + padStr(b.runs, 6) + padStr(b.balls, 6) + padStr(b.fours, 5) + padStr(b.sixes, 5) + padStr(sr, 8) + dismissal + '\n';
        });

        text += '\nExtras: ' + inn.extras.total + ` (WD ${inn.extras.wides}, NB ${inn.extras.noBalls}, B ${inn.extras.byes}, LB ${inn.extras.legByes})\n`;
        text += `Total: ${inn.totalRuns}/${inn.totalWickets} (${formatOvers(inn.totalBalls)} Overs)\n\n`;

        text += 'BOWLING\n';
        text += padStr('Bowler', 20) + padStr('O', 6) + padStr('M', 5) + padStr('R', 5) + padStr('W', 5) + padStr('NB', 5) + padStr('WD', 5) + padStr('Econ', 7) + '\n';
        text += '-'.repeat(60) + '\n';

        inn.bowlingCard.forEach(b => {
            if (b.balls === 0) return;
            const econ = b.balls > 0 ? (b.runs / (b.balls / 6)).toFixed(2) : '0.00';
            text += padStr(b.name, 20) + padStr(formatBowlerOvers(b.balls), 6) + padStr(b.maidens, 5) + padStr(b.runs, 5) + padStr(b.wickets, 5) + padStr(b.noBalls, 5) + padStr(b.wides, 5) + padStr(econ, 7) + '\n';
        });

        if (inn.fallOfWickets.length > 0) {
            text += '\nFall of Wickets: ';
            inn.fallOfWickets.forEach(f => {
                text += `${f.score}/${f.wicket} (${f.batsmanName} ${f.batsmanRuns}, ${f.overs} ov)  `;
            });
            text += '\n';
        }

        text += '\n';
    });

    text += '='.repeat(60) + '\n';
    text += '            Created by Aakash Thakur\n';
    text += '='.repeat(60) + '\n';

    // Download as text file
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${match.teamA.name}_vs_${match.teamB.name}_scorecard.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Scorecard exported!', 'success');
}

    saved.forEach(m => {

        div.className = 'match-item';

        const score = `${inn1.battingTeam}: ${inn1.totalRuns}/${inn1.totalWickets}`;
        const div = document.createElement('div');
        div.className = 'match-item';
        div.onclick = () => loadMatch(m.id);
        div.innerHTML = `
            <div class="match-item-header">
                <span class="match-item-title">${m.teamA.name} vs ${m.teamB.name}</span>
                <span class="badge ${m.status === 'completed' ? 'badge-success' : 'badge-warning'}">${m.status}</span>
            </div>
            <div class="match-item-score">${score}</div>
            ${m.result ? `<div style="font-size:0.78rem; color:var(--accent); margin-top:0.2rem;">${m.result}</div>` : ''}`;
        container.appendChild(div);
    });
}

// =====================================================
// UTILITY FUNCTIONS
// =====================================================
function formatOvers(balls) {
    return Math.floor(balls / 6) + '.' + (balls % 6);
}

function formatBowlerOvers(balls) {
    return Math.floor(balls / 6) + '.' + (balls % 6);
}

function ordinal(n) {
    const s = ['th','st','nd','rd'];
    const v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function padStr(str, len) {
    return String(str).padEnd(len);
}

// =====================================================
// INITIALIZATION
// =====================================================
function init() {
    // Try to restore current match
    const saved = localStorage.getItem(CURRENT_MATCH_KEY);
    if (saved) {
        try {
            match = JSON.parse(saved);
            currentInnings = match.currentInnings || 0;
        } catch (e) {
            match = null;
        }
    }
    renderHome();
}

init();

// =====================================================
// PWA — SERVICE WORKER REGISTRATION & INSTALL PROMPT
// =====================================================
let deferredInstallPrompt = null;

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => {
                console.log('[PWA] Service Worker registered, scope:', reg.scope);
            })
            .catch(err => {
                console.log('[PWA] Service Worker registration failed:', err);
            });
    });
}

// Capture the install prompt event
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    showInstallButton();
});

function showInstallButton() {
    // Add install button to header
    const headerActions = document.querySelector('.header-actions');
    if (!document.getElementById('btnInstall')) {
        const btn = document.createElement('button');
        btn.id = 'btnInstall';
        btn.className = 'btn btn-sm btn-success';
        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg><span class="btn-text">Install App</span>`;
        btn.onclick = installApp;
        headerActions.prepend(btn);
    }
}

async function installApp() {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    const result = await deferredInstallPrompt.userChoice;
    if (result.outcome === 'accepted') {
        showToast('App installed successfully!', 'success');
        const btn = document.getElementById('btnInstall');
        if (btn) btn.remove();
    }
    deferredInstallPrompt = null;
}

window.addEventListener('appinstalled', () => {
    showToast('Cricket Scorer installed on your device!', 'success');
    deferredInstallPrompt = null;
    const btn = document.getElementById('btnInstall');
    if (btn) btn.remove();
});
</script>
